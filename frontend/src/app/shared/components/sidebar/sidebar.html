<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <!-- En-tête -->
  <div class="sidebar__header">
    <div class="sidebar__brand">
      <!-- Logo principal (pleine largeur) -->
      <img
        *ngIf="!collapsed"
        src="/bg.png"
        alt="Coding pour tout apprendre l'avenir"
        class="sidebar__logo-full"
      >
      <!-- Logo réduit (mode replié) -->
      <img
        *ngIf="collapsed"
        src="/bg.png"
        alt="Coding"
        class="sidebar__logo-icon"
      >
      <!-- Texte de la marque (affiché seulement en mode déployé) -->
      <div *ngIf="!collapsed" class="sidebar__brand-text">
        <span class="brand-line-1">Coding pour tout</span>
        <span class="brand-line-2">apprendre l'avenir</span>
      </div>
    </div>

    <button class="sidebar__toggle-btn" (click)="toggle()" title="Réduire/Agrandir">
      <lucide-icon [img]="icons.PanelLeft" [size]="18"></lucide-icon>
    </button>
  </div>

  <!-- Menu de navigation -->
  <nav class="sidebar__nav">
    <a
      *ngFor="let item of navItems()"
      [routerLink]="item.route"
      routerLinkActive="sidebar__link--active"
      class="sidebar__link"
    >
      <lucide-icon [img]="item.icon" [size]="20" class="sidebar__icon"></lucide-icon>
      <span *ngIf="!collapsed" class="sidebar__label">{{ item.label }}</span>
      <span *ngIf="!collapsed" class="sidebar__active-dot"></span>
    </a>

    <!-- Déconnexion intégrée au menu -->
    <button class="sidebar__link sidebar__logout-link" (click)="logout()" title="Déconnexion">
      <lucide-icon [img]="icons.LogOut" [size]="20" class="sidebar__icon"></lucide-icon>
      <span *ngIf="!collapsed" class="sidebar__label">Déconnexion</span>
    </button>
  </nav>

  <!-- Carte IA -->
  <div class="sidebar__ai-card" *ngIf="!collapsed">
    <div class="sidebar__ai-header">
      <lucide-icon [img]="icons.Sparkles" [size]="16" class="sidebar__ai-icon"></lucide-icon>
      <span>ASSISTANT IA</span>
    </div>
    <p class="sidebar__ai-text">
      Optimisez vos trajets et générez vos rapports d'intervention.
    </p>
    <button class="sidebar__ai-btn" [routerLink]="'/chat-ia'">
      Ouvrir l'assistant
    </button>
  </div>
</aside>
