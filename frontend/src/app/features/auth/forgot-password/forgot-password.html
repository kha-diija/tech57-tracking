<div class="auth-page">
  <div class="auth-page__backdrop"></div>
  <div class="auth-page__scrim"></div>
  <div class="auth-page__glow" aria-hidden="true"></div>

  <main class="auth-page__stage">
    <div class="auth-card-shell">
      <section class="auth-card" aria-labelledby="forgot-title">
        <span class="auth-card__badge">
          <img src="/logo.png" alt="TECH-57" class="auth-card__badge-img" />
        </span>

        <header class="auth-card__header">
          <span class="auth-card__eyebrow">TECH&#8209;57 &middot; Tracking &amp; Installation</span>
          <h1 id="forgot-title" class="auth-card__title">Mot de passe oublié</h1>
          <p class="auth-card__subtitle">
            Saisissez votre email : si un compte existe, vous recevrez un lien de réinitialisation.
          </p>
        </header>

        <div class="auth-form__alert auth-form__alert--success" role="status" *ngIf="successMessage() as message">
          {{ message }}
        </div>

        <form class="auth-form" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate *ngIf="!successMessage()">
          <div class="auth-form__alert" role="alert" *ngIf="errorMessage() as message">
            {{ message }}
          </div>

          <div class="auth-field">
            <label class="auth-field__label" for="email">Email</label>
            <div class="auth-field__control">
              <input
                id="email"
                type="email"
                class="auth-field__input"
                placeholder="nom.prenom@tech57.ma"
                formControlName="email"
                autocomplete="email"
                [class.auth-field__input--invalid]="email.invalid && email.touched"
              />
            </div>
            <span class="auth-field__error" *ngIf="email.invalid && email.touched">
              Veuillez saisir un email valide.
            </span>
          </div>

          <button type="submit" class="auth-form__submit" [disabled]="isLoading()">
            <span *ngIf="!isLoading()">Envoyer le lien</span>
            <span *ngIf="isLoading()" class="auth-form__spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div class="auth-form__row" style="margin-top: 1rem; justify-content: center;">
          <a class="auth-form__link" routerLink="/login">Retour à la connexion</a>
        </div>
      </section>
    </div>
  </main>
</div>
