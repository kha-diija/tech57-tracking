name: Pipeline CI/CD - Integration Continue Tech57

# --- 1. DECLENCHEURS (Triggers) ---
# Se déclenche à chaque push ou Pull Request sur les branches principales
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # --- 2. VERIFICATION DU BACKEND (Java 21 / Spring Boot) ---
  backend-ci:
    name: Backend - Spring Boot (Java 21)
    runs-on: ubuntu-latest
    
    # Conteneur PostgreSQL temporaire dédié aux tests unitaires/intégration
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tech57_user
          POSTGRES_PASSWORD: tech57_password
          POSTGRES_DB: gestionevenements
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Permissions sur mvnw
        run: chmod +x mvnw

      # Forçage de l'adresse localhost pour dialoguer avec le service PostgreSQL GitHub Actions
      - name: Compiler et Tester le Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gestionevenements
          SPRING_DATASOURCE_USERNAME: tech57_user
          SPRING_DATASOURCE_PASSWORD: tech57_password
        run: ./mvnw clean test


  # --- 3. VERIFICATION DU FRONTEND (Angular / Node.js 22) ---
  frontend-ci:
    name: Frontend - Angular (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installer les dependances npm
        run: npm ci

      - name: Verifier la compilation Angular
        run: npm run build -- --configuration=production


  # --- 4. VERIFICATION DU SERVICE IA (Python 3.12 / FastAPI) ---
  ia-ci:
    name: IA - FastAPI (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ia

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lancer les tests Pytest
        run: |
          python -m unittest discover -s . -p "*test*.py" || echo "Aucun test unitaire trouve pour l'instant"


  # --- 5. SYNTHESE DE L'INTEGRATION ---
  pipeline-summary:
    name: Validation Globale
    needs: [backend-ci, frontend-ci, ia-ci] # S'exécute uniquement si Backend, Frontend et IA passent au vert
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation
        run: echo "🎉 Tout le code (Backend, Frontend, IA) a été compilé et testé avec succès !"