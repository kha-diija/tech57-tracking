# Port de l'application Spring Boot
server.port=8080

# Configuration de la base de donnees PostgreSQL (Neon)
# Les valeurs viennent des variables d'environnement injectees par Docker/GitHub Secrets
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:4200
app.base-url=http://localhost:8080

# Neon (pooling adapte a une base serverless)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=25000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.validation-timeout=5000

# Dossier physique de stockage (hors classpath, persistant)
app.upload.dir=./uploads

# Limites Spring pour multipart
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Ressources observateur
app.storage.documents-path=ia/data

# Mail (SMTP) - reset password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=http://localhost:4200

# Actuator (necessaire pour le HEALTHCHECK du Dockerfile)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true